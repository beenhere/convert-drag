name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Electron checks (PDF rendering, overlay, editors)
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          xvfb-run -a npx electron --no-sandbox test/electron/run.js
        env:
          SCREENSHOT_DIR: screenshots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: screenshots
          if-no-files-found: ignore

  package:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, arch: arm64, target: --mac }
          - { os: macos-latest, arch: x64, target: --mac }
          - { os: windows-latest, arch: x64, target: --win }
          - { os: ubuntu-latest, arch: x64, target: --linux }
    runs-on: ${{ matrix.os }}
    env:
      # Unsigned builds; set up signing secrets to change this.
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      # ffmpeg-static downloads the binary for this architecture.
      npm_config_arch: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      # --cpu makes npm install sharp's native package for the target arch,
      # so an x64 Mac build made on an Apple-silicon runner gets x64 binaries.
      - run: npm ci --cpu=${{ matrix.arch }}
      - run: npx electron-builder ${{ matrix.target }} --${{ matrix.arch }} --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: ConvertDrag-${{ runner.os }}-${{ matrix.arch }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
